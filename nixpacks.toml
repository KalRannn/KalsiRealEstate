[phases.setup]
nixPkgs = ["python3", "python3Packages.pip", "python3Packages.setuptools", "chromium", "nss", "nspr", "atk", "cups", "dbus", "expat", "libdrm", "libxkbcommon", "mesa", "xorg.libX11", "xorg.libXcomposite", "xorg.libXdamage", "xorg.libXext", "xorg.libXfixes", "xorg.libXrandr", "xorg.libxcb", "pango", "cairo", "alsa-lib"]


[phases.install]
cmds = [
  "python3 -m pip install -r requirements.txt",
  "python3 -m playwright install --with-deps chromium"
]
[start]
cmd = "python3 server.py"